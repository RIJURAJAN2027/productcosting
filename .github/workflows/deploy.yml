name: Deploy

# Deploys main to the Oracle Cloud server after the CI tests have passed on it, or by hand
# (Actions → Deploy → Run workflow).  The code is copied to the server over SSH, so the server needs no
# GitHub access, then scripts/deploy.sh backs up the database and rebuilds the application.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ORACLE_HOST         server address (public IP or domain)
#   ORACLE_USER         SSH user, e.g. ubuntu
#   ORACLE_SSH_KEY      private key whose public key is in ~ORACLE_USER/.ssh/authorized_keys on the server
#   ORACLE_APP_DIR      folder of the installation, e.g. /home/ubuntu/productcosting
#   ORACLE_KNOWN_HOSTS  optional: the server's host key line(s) from `ssh-keyscan <host>` (recommended)
#   ORACLE_SSH_PORT     optional: SSH port (default 22)
# Without these secrets the workflow does nothing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ secrets.ORACLE_HOST }}
      SSH_USER: ${{ secrets.ORACLE_USER }}
      APP_DIR: ${{ secrets.ORACLE_APP_DIR }}
      PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
      REV: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check configuration
        id: cfg
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_USER" ] || [ -z "$APP_DIR" ] || [ -z "$KEY" ]; then
            echo "::notice::Deploy skipped – set ORACLE_HOST, ORACLE_USER, ORACLE_SSH_KEY and ORACLE_APP_DIR to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: ${{ env.REV }}

      - name: SSH key and host
        if: steps.cfg.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            echo "::warning::ORACLE_KNOWN_HOSTS is not set – trusting the server key found now (set it to pin the key)."
            ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Copy the code to the server
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # server-only files (.env, backups, …) are excluded and therefore never changed or deleted
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            --exclude '.git/' --exclude '.github/' --exclude '.env' --exclude '.deployed-revision' \
            --exclude 'backups/' --exclude 'data/' --exclude 'uploads/' --exclude 'exports/' \
            --exclude 'docker/.build-ca.local.pem' --exclude 'node_modules/' --exclude 'frontend/dist/' \
            --exclude 'backend/.venv/' \
            ./ "$SSH_USER@$HOST:$APP_DIR/"

      - name: Back up, rebuild and restart
        if: steps.cfg.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$HOST" \
            "cd '$APP_DIR' && chmod +x scripts/*.sh && sudo scripts/deploy.sh '$REV'"

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
